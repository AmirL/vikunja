name: Deploy image

# Builds the custom deploy image on a GitHub-hosted runner and pushes it to GHCR.
# The VPS does not update by itself: it runs the image pinned by digest in
# /root/vikunja/docker-compose.yml.
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/amirl/vikunja-custom:main
            ghcr.io/amirl/vikunja-custom:${{ github.sha }}
          build-args: |
            RELEASE_VERSION=main-${{ github.sha }}

      - name: Image digest
        run: echo "digest=${{ steps.build.outputs.digest }}"
